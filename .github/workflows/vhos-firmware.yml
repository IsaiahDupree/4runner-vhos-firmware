name: Build VHOS firmware

on:
  pull_request:
  push:
    branches:
      - main
      - agent/**

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Build, merge, and validate
        shell: bash
        run: |
          source /opt/esp/idf/export.sh
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ln -s "$GITHUB_WORKSPACE" /project
          bash tools/build_vhos_release.sh v0.1.0-dev.1
          bash tools/build_mrdiy_v13_release.sh v0.1.0-dev.6
      - uses: actions/upload-artifact@v4
        with:
          name: vhos-gateway-development
          path: |
            dist/*.bin
            dist/*.json
            dist/SHA256SUMS*
